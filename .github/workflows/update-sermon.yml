name: 설교 영상 자동 갱신

on:
  schedule:
    - cron: "0 4-14 * * 0"   # 주일 오후 1시~밤 11시(한국 시간) 매시간
    - cron: "0 3 * * 1-6"    # 평일·토요일 정오(한국 시간) 한 번
  workflow_dispatch: {}       # Actions 탭에서 직접 실행

permissions:
  contents: write

concurrency:
  group: update-sermon
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 최신 주일예배 영상 확인
        env:
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
        run: python3 .github/scripts/update_sermon.py
      - name: 바뀐 내용이 있으면 게시
        run: |
          if git diff --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "godswillhanachurch"
          git config user.email "godswillhanachurch@users.noreply.github.com"
          git add index.html images/sermon-thumb.jpg
          git commit -m "설교 영상 자동 갱신"
          git push
